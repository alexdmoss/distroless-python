stages:
- build-builder
- build-distroless
- basic-tests
- http-tests
- advanced-tests
- scan
- publish

# ---------------------- Variables ---------------------- #

default:
  tags:
    - alexos-self-runner

# Upstream bases are pinned as tag@digest so Renovate raises an MR (and this
# pipeline rebuilds) whenever upstream rebuilds them. PYTHON_VERSION and
# DEBIAN_NAME are read from the python tag in scripts/vars.sh
variables:
  # renovate: datasource=docker depName=aquasec/trivy
  TRIVY_VERSION: "0.76.1"
  GOOGLE_DISTROLESS_BASE_IMAGE: "gcr.io/distroless/cc-debian13:latest@sha256:58e12be899275afaa05f1b03051ab19037ed7f252528e57a3a9ad7e220a62578"
  GOOGLE_DISTROLESS_DEBUG_BASE_IMAGE: "gcr.io/distroless/cc-debian13:debug@sha256:ca230038e47b2c5da754b6a8f8a503f81bb54580e0897831814953f3d203e98b"

.python-3.13-debian13:
  variables:
    PYTHON_BASE_IMAGE: "python:3.13.18-slim-trixie@sha256:ae14d4ce8771606477a81446e7ef429edd6762305fc50c84507c1041fa8285d1"
    OS_VERSION: debian13

.python-3.14-debian13:
  variables:
    PYTHON_BASE_IMAGE: "python:3.14.10-slim-trixie@sha256:930e1abba7c4e8f96ed93e8012c35d174d7732752731bbd5e8e757d7ec6f3966"
    OS_VERSION: debian13

# --------------------- Build Stages -------------------- #

include:
- local: "stages/gitlab-templates.yaml"
- local: "stages/python-3.13-debian13.yaml"
- local: "stages/python-3.14-debian13.yaml"
