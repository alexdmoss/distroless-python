stages:
- build-builder
- build-distroless
- basic-tests
- http-tests
- advanced-tests
- scan
- publish

# ---------------------- Variables ---------------------- #

default:
  tags:
    - alexos-self-runner

# Upstream bases are pinned as tag@digest so Renovate raises an MR (and this
# pipeline rebuilds) whenever upstream rebuilds them. PYTHON_VERSION and
# DEBIAN_NAME are read from the python tag in scripts/vars.sh
variables:
  # renovate: datasource=docker depName=aquasec/trivy
  TRIVY_VERSION: "0.76.2"
  GOOGLE_DISTROLESS_BASE_IMAGE: "gcr.io/distroless/cc-debian13:latest@sha256:809d04afa1be033c441f76bb0051878c342fb76d0ea236bc6dc94b655fa0fbd6"
  GOOGLE_DISTROLESS_DEBUG_BASE_IMAGE: "gcr.io/distroless/cc-debian13:debug@sha256:2c1561995d131158b6f6d23f634ba18a553549f3e81e3705a0e1fcc45b997614"

.python-3.13-debian13:
  variables:
    PYTHON_BASE_IMAGE: "python:3.13.18-slim-trixie@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90"
    OS_VERSION: debian13

.python-3.14-debian13:
  variables:
    PYTHON_BASE_IMAGE: "python:3.14.10-slim-trixie@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f"
    OS_VERSION: debian13

# --------------------- Build Stages -------------------- #

include:
- local: "stages/gitlab-templates.yaml"
- local: "stages/python-3.13-debian13.yaml"
- local: "stages/python-3.14-debian13.yaml"
