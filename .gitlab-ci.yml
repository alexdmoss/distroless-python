stages:
- build-builder
- build-distroless
- basic-tests
- http-tests
- advanced-tests
- scan
- publish

# ---------------------- Variables ---------------------- #

default:
  tags:
    - alexos-self-runner

# Upstream bases are pinned as tag@digest so Renovate raises an MR (and this
# pipeline rebuilds) whenever upstream rebuilds them. PYTHON_VERSION and
# DEBIAN_NAME are read from the python tag in scripts/vars.sh
variables:
  # renovate: datasource=docker depName=aquasec/trivy
  TRIVY_VERSION: "0.76.1"
  GOOGLE_DISTROLESS_BASE_IMAGE: "gcr.io/distroless/cc-debian13:latest@sha256:d74d144baa124dd9defd01d71872bb56c49d4441dba6153ccf790364f97e64b1"
  GOOGLE_DISTROLESS_DEBUG_BASE_IMAGE: "gcr.io/distroless/cc-debian13:debug@sha256:8eb229dfe1ec97410a495e312dfba214afd86bfc72010973e08796ac5e94e234"

.python-3.13-debian13:
  variables:
    PYTHON_BASE_IMAGE: "python:3.13.18-slim-trixie@sha256:76baad6037690d6e8c4397fbcaef17bca6f19eecef822b708fe8fa3417d30bb5"
    OS_VERSION: debian13

.python-3.14-debian13:
  variables:
    PYTHON_BASE_IMAGE: "python:3.14.10-slim-trixie@sha256:3cabfd7d7aaf394e6040e79fa1eec6ca1c52b74ed9188650472695d9a9326999"
    OS_VERSION: debian13

# --------------------- Build Stages -------------------- #

include:
- local: "stages/gitlab-templates.yaml"
- local: "stages/python-3.13-debian13.yaml"
- local: "stages/python-3.14-debian13.yaml"
